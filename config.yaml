# Scientific parameters. Machine-specific paths are not part of the config hash.
# DATA_ROOT or COMMISSIONING_DATA overrides paths.data_root.
# COMMISSIONING_WORK, --data-root and --work-root override the other paths.

protocol_version: 1
seed: 42
n_calibration: 20
alpha: 0.05
n_repeats: 20
n_grid: [1, 2, 4, 8, 16, 32, 64]
strategies: [random, kcenter]
aulc_n_max: 32
practical_tpr: 0.95
practical_fpr: 0.05
n_star_min_repeats: 16
fpr_aulc_margin: 0.01
stopping_deltas: [0.025, 0.05, 0.10]
stopping_delta_main: 0.05
bootstrap_replicates: 10000
bootstrap_seed: 42

backbone: wide_resnet50_2
layers: [layer2, layer3]
resize: 256
center_crop: 224
upsample_mode: bilinear
imagenet_mean: [0.485, 0.456, 0.406]
imagenet_std: [0.229, 0.224, 0.225]
feature_batch_size: 8
distance_query_batch: 8
distance_train_batch: 16

e0:
  auroc_mean_tolerance: 0.005
  spearman_min: 0.99
  num_neighbors_ref: 9
  num_neighbors_rq: 1
  coreset_ratio: 0.1
  # Operational sanity floor for the reference Anomalib run. Roth et al. report ~0.991.
  mean_auroc_floor: 0.97
  reference_mean_auroc: 0.991

paths:
  data_root: data/mvtec
  work_root: .

objects:
  - bottle
  - cable
  - capsule
  - hazelnut
  - metal_nut
  - pill
  - screw
  - toothbrush
  - transistor
  - zipper
textures:
  - carpet
  - grid
  - leather
  - tile
  - wood

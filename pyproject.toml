[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commissioning"
version = "0.1.0"
description = "Defect-free commissioning of memory-bank anomaly detection on MVTec AD"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "PyYAML>=6",
    "Pillow>=10",
    "tqdm>=4.66",
]

[project.optional-dependencies]
gpu = ["torch>=2.1", "torchvision>=0.16", "timm>=0.9"]
anomalib = ["anomalib>=2.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["commissioning*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
